logging:
  level:
    com:
      eazybytes:
        gatewayserver: INFO

  pattern: # for distributed tracing [tags, traceId, spanId]
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

# Circuit Breaker Configs
resilience4j.circuitbreaker:
  configs:
    default: # default means this circuit breaker config will applicable for all circuit breakers, like : accountsCircuitBreaker, cardsCircuitBreaker, loansCircuitBreaker
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000